name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup bun
        # SHA-pinned to v2.2.0. oven-sh/setup-bun was added to this repo's Actions
        # allowlist so the official action can replace the earlier curl|bash
        # installer (which bypassed the allowlist and was unpinned).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # NOTE: the npm Takumi Guard (flatt-security/setup-takumi-guard-npm) was
      # dropped with the bun migration — it intercepts npm-registry traffic and
      # does not cover bun installs. The Go Takumi Guard below is unchanged.

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        shell: bash
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "PW_VERSION=$PW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install just (rust-just via pipx)
        run: pipx install rust-just

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Compute Go cache paths
        id: go-cache
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT
          echo "gocache=$(go env GOCACHE)" >> $GITHUB_OUTPUT

      - name: Set up Takumi Guard (Go)
        uses: flatt-security/setup-takumi-guard-golang@v1

      - name: Cache Go modules and build cache
        id: go-cache-step
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.gomodcache }}
            ${{ steps.go-cache.outputs.gocache }}
          key: ${{ runner.os }}-go-${{ hashFiles('scripts/ws-jsonrpc-server/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
           k6-version: '1.3.0'
           browser: false

      - name: Cache Playwright browsers
        id: playwright-browsers-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-v${{ steps.pw-version.outputs.PW_VERSION }}

      - name: Install Playwright (chromium only)
        timeout-minutes: 5
        if: steps.playwright-browsers-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - name: Cache hits summary (before tests)
        if: always()
        run: |
          echo "Go cache hit: ${{ steps['go-cache-step'].outputs['cache-hit'] || 'false' }}"
          echo "Playwright cache hit: ${{ steps['playwright-browsers-cache'].outputs['cache-hit'] || 'false' }}"
          echo "Playwright version: ${{ steps['pw-version'].outputs.PW_VERSION }}"
          echo "Hashes — bun.lock: ${{ hashFiles('bun.lock') }}, go.mod: ${{ hashFiles('scripts/ws-jsonrpc-server/go.mod') }}"

      - name: Type check + Unit tests (just)
        run: just test-ci

      - name: E2E tests (just e2e)
        run: just e2e
        env:
          CI: true

      - name: E2E tests (just e2e-real)
        run: just e2e-real

      - name: k6 WebSocket scenario (just k6-local)
        run: just k6-local
        env:
          # Allow overriding from workflow_dispatch or env if needed
          K6_WS_TIMEOUT_MS: 5000

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-next-cache-

      - name: Build
        run: bun run build

      - name: Cache hits summary (after build)
        if: always()
        run: |
          echo "Next cache restored: ${{ steps['next-cache'].outputs['cache-hit'] || 'false' }}"
